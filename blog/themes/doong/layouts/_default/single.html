{{ define "main" }}
<div class="post-container">
  <div class="post-header">
    <a href="{{ "/" | relURL }}" class="back-link">← Back to home</a>
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-date">{{ .Date.Format "January 2, 2006" }}</div>
  </div>
  
    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }} class="toc" {{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
  
  <a href="{{ "/" | relURL }}" class="back-link">← Back to home</a>
</div>
{{ end }}
