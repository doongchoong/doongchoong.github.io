// Mobile adaptation guided by Dex (OpenAI Codex, GPT5.6-sol), 2026
pointer_move: function (e) {
  var rect = this.canvas.getBoundingClientRect();

  /*
   * 화면에서는 Canvas가 축소되어 있으므로
   * 화면 좌표를 원래 660 × 480 좌표로 환산한다.
   */
  this.mouseX =
    (e.clientX - rect.left) * (this.w / rect.width);

  this.mouseY =
    (e.clientY - rect.top) * (this.h / rect.height);

  this.pointerActive = true;

// Mobile adaptation guided by Dex (OpenAI Codex, GPT5.6-sol), 2026
update_points: function () {
  for (var i = 0; i < this.points.length; i++) {
    var pnt = this.points[i];
    var pushX = 0;
    var pushY = 0;

    if (this.pointerActive) {
      var dx = pnt.x - this.mouseX;
      var dy = pnt.y - this.mouseY;
      var length = Math.max(Math.sqrt(dx * dx + dy * dy), 0.001);

      var force = Math.min(
        this.sensitivity * 100 / length,
        130
      );

      pushX = dx / length * force;
      pushY = dy / length * force;
    }

    pnt.x += pushX + (pnt.ox - pnt.x) * 0.05;
    pnt.y += pushY + (pnt.oy - pnt.y) * 0.05;
  }
},
	draw_points: function(){
		for(var i=0; i < this.points.length; i++){
			var pnt = this.points[i];
			this.draw_point(pnt.x, pnt.y, pnt.color);
		}
	},
	draw_point: function(x,y, color){
		this.ctx.fillStyle = color;
		this.ctx.beginPath();
		//this.ctx.arc(x, y, 3, 0, Math.PI*2, true);
		this.ctx.rect(x,y,4,8);
		this.ctx.closePath();
		this.ctx.fill();

// Mobile adaptation guided by Dex (OpenAI Codex, GPT5.6-sol), 2026
draw: function () {
  this.ctx.clearRect(0, 0, this.w, this.h);
  this.update_points();
  this.draw_points();
}

// Mobile adaptation guided by Dex (OpenAI Codex, GPT5.6-sol), 2026
var frameInterval = 1000 / 60;
var lastFrame = 0;

function animate(now) {
  if (now - lastFrame >= frameInterval) {
    cut_water.draw();
    lastFrame = now - ((now - lastFrame) % frameInterval);
  }

  requestAnimationFrame(animate);
}

<script>
(function () {
  var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
  function set(t, save) {
    root.setAttribute('data-theme', t);
    if (save) try { localStorage.setItem('theme', t); } catch (e) {}
    document.dispatchEvent(new CustomEvent('themechange'));
  }
  document.querySelector('.theme-toggle').addEventListener('click', function () {
    set(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
  
  mq.addEventListener && mq.addEventListener('change', function (e) {
    if (!saved()) set(e.matches ? 'dark' : 'light', false);
  });
})();
</script>
